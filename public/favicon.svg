<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDFB"/>
      <stop offset="100%" stop-color="#FFF4EC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E8CFC2" flood-opacity=".35"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="58" fill="url(#bg)"/>

  <!-- heart moved to top-right -->
  <path fill="#FF7D93"
    d="M98 22
       C98 18.5 95.2 16 92 16
       C88.8 16 86.8 18.1 85.7 20.8
       C84.6 18.1 82.6 16 79.4 16
       C76.2 16 73.5 18.5 73.5 22
       C73.5 28 85.7 35.8 85.7 35.8
       C85.7 35.8 98 28 98 22Z"/>

  <g filter="url(#shadow)">
    <!-- top stone -->
    <rect x="41" y="20" width="46" height="8" rx="3.5" fill="#D8C3B1"/>

    <!-- neck -->
    <path d="M49 28
             C47 35 46 42 46 49
             L82 49
             C82 42 81 35 79 28Z"
          fill="#E7D7CB"/>

    <!-- waist band -->
    <rect x="39" y="49" width="50" height="7" rx="3.5" fill="#D8C3B1"/>

    <!-- lower body -->
    <path d="M46 56
             C43 66 42 79 42 95
             L86 95
             C86 79 85 66 82 56Z"
          fill="#E7D7CB"/>

    <!-- window -->
    <rect x="58" y="36" width="12" height="10" rx="2" fill="#8E786A"/>

    <!-- entrance -->
    <rect x="56" y="84" width="16" height="11" rx="2" fill="#8E786A"/>

    <!-- brick lines -->
    <g stroke="#C7B1A2" stroke-width="1.8" stroke-linecap="round" opacity=".7">
      <line x1="51" y1="33" x2="77" y2="33"/>
      <line x1="49" y1="62" x2="79" y2="62"/>
      <line x1="47" y1="72" x2="81" y2="72"/>
      <line x1="45" y1="82" x2="83" y2="82"/>
    </g>
  </g>

  <circle cx="64" cy="64" r="58" fill="none" stroke="#F4DED3" stroke-width="2"/>
</svg>
